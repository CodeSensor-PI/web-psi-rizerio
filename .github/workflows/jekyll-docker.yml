name: 🧱 Build e Publicação da Imagem Docker (Psi-Rizerio)

on:
  push:
    branches:
      - refactor/login-jwt-cookies
      - infra/workflow
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📥 Install dependencies
        run: npm ci --include=dev

      - name: 🏗️ Build React app
        run: npx vite build

      # --------------------------------
      #   GERAR TAG INCREMENTAL
      # --------------------------------
      - name: 🏷️ Generate incremental tag
        id: tags
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: 🔐 Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # --------------------------------
      #     BUILD COM DUAS TAGS
      # --------------------------------
      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/web-psi-rizerio:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/web-psi-rizerio:${{ steps.tags.outputs.tag }} \
            .

      # --------------------------------
      #     PUSH DAS DUAS IMAGENS
      # --------------------------------
      - name: 🚀 Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/web-psi-rizerio:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/web-psi-rizerio:${{ steps.tags.outputs.tag }}
